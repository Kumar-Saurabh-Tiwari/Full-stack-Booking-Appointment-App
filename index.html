<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking Appointment App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="container py-5">
      <header class="mb-4">
        <h1 class="h2 mb-1">Booking Appointment App</h1>
      </header>

      <div class="card">
        <div class="card-body">
          <h2 class="h5 mb-3">Register user</h2>
          <form id="feedback-form">
            <label for="feedback-username" class="form-label">UserName</label>
            <input id="feedback-username" class="form-control" name="username" type="text" maxlength="80" autocomplete="name" required>

            <label for="feedback-phone" class="form-label mt-3">Phone Number</label>
            <input id="feedback-phone" class="form-control" name="phone" type="tel" maxlength="20" autocomplete="tel" required>

            <label for="feedback-email" class="form-label mt-3">Email</label>
            <input id="feedback-email" class="form-control" name="email" type="email" maxlength="120" autocomplete="email" required>

            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-primary" type="submit">Submit</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card mt-4">
        <div class="card-body">
          <h2 class="h5 mb-3">All users</h2>
          <div id="feedback-list" class="list-group list-group-flush" aria-live="polite"></div>
        </div>
      </div>

      <p id="status-message" class="mt-3 small" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
